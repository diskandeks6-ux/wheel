<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Рулетка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14121f; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  .roulette { position: relative; width: 100%; max-width: 520px; height: 132px; overflow: hidden; border-radius: 14px;
    background: #1d1a2e; border: 2px solid #2f2a4a; }
  .roulette::before, .roulette::after { content: ""; position: absolute; top: 0; bottom: 0; width: 70px; z-index: 2; pointer-events: none; }
  .roulette::before { left: 0; background: linear-gradient(90deg, #14121f, transparent); }
  .roulette::after { right: 0; background: linear-gradient(270deg, #14121f, transparent); }
  .marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; background: #ffd54a; z-index: 3;
    box-shadow: 0 0 12px rgba(255,213,74,.9); }
  .marker::before, .marker::after { content: ""; position: absolute; left: -8px; border-left: 10px solid transparent; border-right: 10px solid transparent; }
  .marker::before { top: 0; border-top: 14px solid #ffd54a; }
  .marker::after { bottom: 0; border-bottom: 14px solid #ffd54a; }
  .strip { display: flex; height: 100%; padding: 12px 0; will-change: transform; }
  .cell { flex: 0 0 104px; margin: 0 4px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-weight: 800; font-size: 17px; padding: 6px; line-height: 1.15; color: #fff;
    border-bottom: 5px solid rgba(0,0,0,.35); }
  .cell.win { outline: 3px solid #ffd54a; }
  button { font: inherit; font-weight: 700; font-size: 18px; padding: 14px 34px; border: 0; border-radius: 14px;
    background: #ffd54a; color: #14121f; cursor: pointer; }
  button:disabled { opacity: .5; }
  #result { min-height: 56px; text-align: center; font-size: 20px; font-weight: 700; }
  #result small { display: block; font-weight: 400; font-size: 14px; opacity: .75; margin-top: 4px; }
</style>
</head>
<body>
  <h1>🎰 Рулетка</h1>
  <div class="roulette">
    <div class="marker"></div>
    <div class="strip" id="strip"></div>
  </div>
  <div id="counter" style="font-weight:700;font-size:18px;color:#ffd54a"></div>
  <button id="spin">Крутить</button>
  <div id="result"></div>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var q = new URLSearchParams(location.search);
  var labels = (q.get("l") || "Пусто|×2|×5|Джекпот").split("|").filter(Boolean);
  var n = labels.length;
  // заранее определённые ботом результаты подряд: w=3,1,4
  var wins = (q.get("w") || "").split(",").map(function (x) { return parseInt(x, 10); })
    .filter(function (x) { return !isNaN(x) && x >= 0 && x < n; });
  var total = wins.length;
  var left = total;
  var colors = ["#e63946", "#2a9d8f", "#f4a261", "#6a4c93", "#1d8cf8", "#c9a227", "#ef476f", "#06a77d"];

  var CELL = 112, STRIP = 70, TARGET = 56;
  var strip = document.getElementById("strip");
  var roulette = strip.parentNode;
  var btn = document.getElementById("spin");
  var res = document.getElementById("result");
  var counter = document.getElementById("counter");

  function makeCell(idx) {
    var c = document.createElement("div");
    c.className = "cell";
    c.style.background = colors[idx % colors.length];
    var t = labels[idx];
    c.textContent = t.length > 14 ? t.slice(0, 13) + "…" : t;
    return c;
  }
  function offsetFor(pos, jitter) {
    return roulette.clientWidth / 2 - (pos * CELL + CELL / 2) + (jitter || 0);
  }
  // новая лента: случайные призы, на позиции TARGET — выпавший
  function build(winIdx) {
    strip.style.transition = "none";
    strip.innerHTML = "";
    for (var i = 0; i < STRIP; i++) {
      strip.appendChild(makeCell(i === TARGET ? winIdx : Math.floor(Math.random() * n)));
    }
    strip.style.transform = "translateX(" + offsetFor(3) + "px)";
    void strip.offsetWidth; // применить стартовое положение
  }
  function refresh() {
    if (left > 0) {
      btn.textContent = "Крутить (осталось " + left + ")";
      counter.textContent = "🎟 Осталось: " + left + " из " + total;
    } else {
      counter.textContent = "Все крутки сделаны ✅";
    }
  }

  build(total ? wins[0] : 0);
  if (!total) {
    btn.disabled = true;
    counter.textContent = "";
    res.innerHTML = "Открой рулетку из бота: «🛒 Маркетплейс» → «🛍 Каталог» → «🎰 Рулетка»";
  } else {
    refresh();
  }

  btn.addEventListener("click", function () {
    if (!total || btn.disabled || left <= 0) return;
    btn.disabled = true;
    res.innerHTML = "";
    var current = wins[total - left];
    var jitter = (Math.random() - .5) * (CELL - 30);
    strip.style.transition = "transform 5s cubic-bezier(.08,.6,.12,1)";
    strip.style.transform = "translateX(" + offsetFor(TARGET, jitter) + "px)";
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred("medium"); } catch (e) {} }
    setTimeout(function () {
      strip.children[TARGET].classList.add("win");
      left--;
      res.innerHTML = "Выпало: " + labels[current].replace(/</g, "&lt;") +
        "<small>Приз уже на балансе — подробности придут в бот</small>";
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
      refresh();
      if (left > 0) {
        // готовим следующую крутку, не выходя из рулетки
        setTimeout(function () {
          build(wins[total - left]);
          btn.disabled = false;
        }, 1400);
      } else {
        btn.textContent = "Готово";
        // всё прокручено — сообщаем боту (страница закроется, итоги придут в чат)
        setTimeout(function () { try { if (tg && tg.sendData) tg.sendData("done"); } catch (e) {} }, 2500);
      }
    }, 5200);
  });
})();
</script>
</body>
</html>
